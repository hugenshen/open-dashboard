name: Deploy DataQ product vision

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"
      - ".teamai/docs/proposals/P018-workbuddy-open-capabilities/req/dataq-workbuddy-introduction.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp .teamai/docs/proposals/P018-workbuddy-open-capabilities/req/dataq-workbuddy-introduction.html _site/index.html
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
