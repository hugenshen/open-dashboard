# Embedded in OD AppShell: hide dsh's own session chrome (brand + session list).
# OD already owns left-nav; hi-fi is centered ask only (conversation-ask-dsh).
# Conversation never asks the user to pick a dsh folder workspace.
- id: ui-sidebar
  disabled: true

- id: ui-brand-official
  disabled: true

# 0.1.2: ui-conversation injects uiWorkspace. Keep the plugin on so the iframe can boot;
# od-nodes CSS still hides the folder-picker chrome (对话页不选手动工作区).

# LAN share: bind all interfaces so http://<lan-ip>:5173 iframe can reach :3090.
# Coding shells/fs are disabled in this profile. CLI --host 0.0.0.0 is blocked;
# this row overrides the webserver config instead.
- id: webserver
  inject: [webStartup]
  config:
    host: '0.0.0.0'
    port: !!js ctx.webStartup.port ?? 3090

- insert:
    - id: od-auth
      name: '@opendashboard/dsh-od-auth'

    - id: od-bi
      name: '@opendashboard/dsh-od-bi'

    - id: od-nodes
      name: '@opendashboard/dsh-od-nodes'
