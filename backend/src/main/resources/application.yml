server:
  port: 8080

spring:
  application:
    name: open-dashboard
  datasource:
    url: jdbc:postgresql://localhost:5432/opendashboard
    username: opendashboard
    password: opendashboard
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

opendashboard:
  # When true, query endpoints return stub ResultTable without a live warehouse
  stub-query: true
