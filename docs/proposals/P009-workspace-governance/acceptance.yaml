  expected: 登录成功进入工作台；注册可选择邀请码加入或创建工作区；账号下拉可进入账号设置与修改密码；退出登录先确认，再跳到 login.html?logged_out=1；修改密码不改变 workspace/role/ACL。
  evidence: "2026-08-19：新增 login.html、register.html、account-settings.html；shell 账号下拉接入账号设置、修改密码、切换账号和退出确认。2026-08-20：Vue 实现 /login 与 /forbidden，router.beforeEach 要求除分享页外均有显式登录态；/workspace-admin 要求 workspace:admin 或 workspace:manage_member；AppShell 退出清空本地身份并回 /login?logged_out=1；后端 auth.dev-fallback 默认关闭，/api/auth/me 与 /api/auth/menus 无身份返回 401。正式账号密码服务、注册 API、忘记密码和 SSO 仍未实现。"
