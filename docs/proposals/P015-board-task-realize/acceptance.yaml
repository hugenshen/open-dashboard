  - id: PR-REAL-20
    title: 类型化编译、持久 BoardRun 与同等级失败降级
    gate: code
    criterion: 生成链使用经 JSON Schema/host validator 校验的 AnalysisBrief → BoardQuestion → QuerySpec → ResultProfile → VizSpec → BoardSpec；LLM 不得直接产 SQL、DashboardPatch、坐标或最终图种。BoardRun/TaskRun/Event 持久化 planHash、semanticVersion、attempt/error/repair、预算和 idempotencyKey；重复确认返回同一 run，重启可恢复，patch 只提交一次。生产 od_compose_board/od_generate_board 不得绕过同一 semantic/query/review/publish gate；KPI 与非 KPI 都有真实 query trace；preview-only transform 不得提交。
    method: api
    command_or_path: docs/proposals/P015-board-task-realize/architecture-assessment.md · opendashboard-dsh-harness/packages/dsh-od-bi · open-dashboard-backend/open-dashboard-app/src/main/java/io/opendashboard/application/conversation/BoardRunService.java · board lifecycle E2E
