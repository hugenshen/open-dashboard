    command_or_path: docs/proposals/P015-board-task-realize/architecture-assessment.md · docs/design/openapi.yaml · open-dashboard-backend/open-dashboard-domain/src/main/java/io/opendashboard/domain/semantic · open-dashboard-backend/open-dashboard-app/src/main/java/io/opendashboard/application/semantic
