  - id: PR-REAL-18
    title: t_pay_order 语义就绪、标识字段与失败降级硬闸
    gate: acceptance
    criterion: 以 t_pay_order 的原始 60 字段新建数据集，de_dataset_field_profile 为 0 行且无 confirmed 指标时，系统必须判定 semanticReady=false 并阻止整板写入，或先完成语义学习后再规划；planner/credentials/review 失败不得降级调用无同等级质量闸的 od_compose_board。名称/注释像 ID、订单号的字段不得作 SUM/AVG 度量或高基数轴；Status/Type 等编码维不得当度量；字段注释中的状态码写入 valueMap。任何路径均禁止 SUM(MchId/MchType/MchRate)、订单号作高基数柱/饼分类轴、原始 ExpireTime × SUM(ID) 趋势。
