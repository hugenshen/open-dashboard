proposal: P003
items:
  - id: PR-RPT-01
    title: 报告生命周期
    gate: acceptance
    criterion: 用户可创建、编辑、保存、预览和发布 Umo 报告。
    method: ui
    command_or_path: /reports
    expected: draft 与 published 文档独立持久化。
    evidence: open-dashboard-frontend/src/report/
    status: pass
    blocker_of_done: true
    requirements_target: PR-RPT-01
  - id: PR-RPT-02
    title: 引用仪表盘图表
    gate: acceptance
    criterion: 三栏向导可按勾选顺序插入多个已授权图表。
    method: ui
    command_or_path: /reports/{id}/edit
    expected: 节点保存 dashboardId 与 chartId，重新打开不丢失。
    evidence: open-dashboard-frontend/src/report/
    status: pass
    blocker_of_done: true
    requirements_target: PR-RPT-02
  - id: PR-RPT-03
    title: 报告内新建图表
    gate: acceptance
    criterion: 用户可选择数据集、字段、图形和样式创建 inline 图表。
    method: ui
    command_or_path: /reports/{id}/edit
    expected: inline 配置只写报告节点，不创建仪表盘图表。
    evidence: open-dashboard-frontend/src/report/
    status: pass
    blocker_of_done: true
    requirements_target: PR-RPT-03
  - id: PR-RPT-04
    title: 实时取数复用
    gate: code
    criterion: 引用图和 inline 图均通过 chartQuery 或 datasetQuery 取数。
    method: api
    command_or_path: docs/design/openapi.yaml
    expected: 报告文档不持久化 ResultTable。
    evidence: open-dashboard-backend/
    status: pass
    blocker_of_done: true
    requirements_target: PR-RPT-04
  - id: PR-RPT-05
    title: 图表节点可继续编辑
    gate: acceptance
    criterion: 插入后的 inline 图可通过 inspector 修改数据和样式。
    method: ui
    command_or_path: /reports/{id}/edit
    expected: 修改保存后重新打开仍一致。
    evidence: open-dashboard-frontend/src/report/
    status: pass
    blocker_of_done: true
    requirements_target: PR-RPT-05
  - id: PR-RPT-06
    title: 权限失败安全降级
    gate: acceptance
    criterion: 无看板或数据集权限时图表显示错误占位，报告页面不白屏且不泄露结果。
    method: ui
    command_or_path: /reports/{id}/view
    expected: 无权限请求不返回业务结果行。
    evidence: open-dashboard-frontend/src/report/
    status: pass
    blocker_of_done: true
    requirements_target: PR-RPT-06
  - id: PR-RPT-07
    title: 删除隔离
    gate: acceptance
    criterion: 删除报告 inline 图不影响任何仪表盘或 de_chart_view。
    method: ui
    command_or_path: /reports/{id}/edit
    expected: 仅报告文档节点被删除。
    evidence: open-dashboard-backend/
    status: pass
    blocker_of_done: true
    requirements_target: PR-RPT-07
