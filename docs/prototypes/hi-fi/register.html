<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>注册 · DataQ 高保</title>
  <script>document.documentElement.dataset.odTheme = localStorage.getItem('od.theme') || 'light';try{var b=localStorage.getItem('od.brand');if(b)document.documentElement.dataset.odBrand=b;}catch(e){}</script>
  <link rel="stylesheet" href="./shared/shell.css" />
  <link rel="stylesheet" href="./shared/auth.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-rail">
      <a class="auth-brand" href="./login.html"><img class="od-brand-mark" src="./shared/ip/od-ip-B1-otter-lower-left.png" width="36" height="36" alt="" /><span>DataQ</span></a>
      <div class="auth-hero">
      <div class="auth-copy">
        <h1>先建立用户，再进入工作区</h1>
        <p>注册只创建用户身份；能看到哪些数据、能否问数和生成看板，由加入的工作区和角色决定。</p>
      </div>
      <div class="auth-flow">
        <div><b>加入已有工作区</b><span>输入邀请码后成为待审核成员。</span></div>
        <div><b>创建新工作区</b><span>首个用户成为工作区管理员。</span></div>
        <div><b>后续治理</b><span>管理员在成员权限页绑定项目组、角色和数据策略。</span></div>
      </div>
      </div>
    </section>

    <section class="auth-main">
      <form class="auth-card" id="registerForm">
        <h2>注册账号</h2>
        <p class="sub">注册完成后进入工作区选择页；没有工作区权限时不能发起问数。</p>

        <div class="row-2">
          <div class="field">
            <label for="name">姓名</label>
            <input id="name" autocomplete="name" value="赵演示" />
          </div>
          <div class="field">
            <label for="email">邮箱</label>
            <input id="email" autocomplete="email" value="demo@opendashboard.local" />
          </div>
        </div>

        <div class="field">
          <label for="password">设置密码</label>
          <input id="password" type="password" autocomplete="new-password" value="demo123456" />
        </div>
        <div class="field">
          <label for="mode">工作区方式</label>
          <select id="mode">
            <option value="invite">使用邀请码加入已有工作区</option>
            <option value="create">创建新的工作区</option>
          </select>
        </div>
        <div class="field" id="inviteField">
          <label for="invite">邀请码</label>
          <input id="invite" value="RETAIL-2026" />
        </div>
        <div class="field" id="workspaceField" style="display:none">
          <label for="workspace">新工作区名称</label>
          <input id="workspace" value="零售经营项目组" />
        </div>

        <label class="checkline"><input type="checkbox" checked /> 我同意只在已授权工作区内使用数据和知识</label>
        <button class="auth-btn" type="submit">注册并继续</button>
        <div class="form-foot">已有账号？ <a href="./login.html">去登录</a></div>
      </form>
    </section>
  </main>
  <script>
    const mode = document.getElementById('mode');
    mode.onchange = () => {
      document.getElementById('inviteField').style.display = mode.value === 'invite' ? 'block' : 'none';
      document.getElementById('workspaceField').style.display = mode.value === 'create' ? 'block' : 'none';
    };
    document.getElementById('registerForm').onsubmit = (e) => {
      e.preventDefault();
      location.href = './workbench.html';
    };
  </script>
</body>
</html>
