<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>账号设置 · Open Dashboard 高保</title>
  <script>document.documentElement.dataset.odTheme = localStorage.getItem('od.theme') || 'light';</script>
  <link rel="stylesheet" href="./shared/shell.css" />
  <link rel="stylesheet" href="./shared/auth.css" />
</head>
<body data-mod="account">
<div class="od-app" id="odApp">
  <div class="od-col">
    <main class="account-page od-page">
      <div class="account-inner">
        <aside class="account-side">
          <div class="profile"><i>演</i><div><b>赵演示</b><span>user-demo</span></div></div>
          <nav class="account-nav" aria-label="账号设置">
            <button class="on" type="button" data-tab="profile">个人资料</button>
            <button type="button" data-tab="password">修改密码</button>
            <button type="button" data-tab="security">登录安全</button>
            <button type="button" data-tab="notify">通知偏好</button>
          </nav>
        </aside>

        <section class="account-main">
          <div class="account-panel on" data-pane="profile">
            <h1>个人资料</h1>
            <p>这些信息用于展示和审计。userId 由登录系统生成，不允许用户自行修改。</p>
            <div class="row-2">
              <div class="field"><label for="name">姓名</label><input id="name" value="赵演示" /></div>
              <div class="field"><label for="email">邮箱</label><input id="email" value="demo@opendashboard.local" /></div>
            </div>
            <div class="row-2">
              <div class="field"><label for="phone">手机号</label><input id="phone" value="138****0000" /></div>
              <div class="field"><label for="lang">语言</label><select id="lang"><option>简体中文</option><option>English</option></select></div>
            </div>
            <div class="savebar"><button class="ghost-btn" type="button" style="width:auto;margin:0">取消</button><button class="auth-btn" type="button" style="width:auto;margin:0" data-save>保存资料</button></div>
          </div>

          <div class="account-panel" data-pane="password">
            <h1>修改密码</h1>
            <p>修改后当前设备保持登录，其它设备需要重新登录；企业 SSO 用户在身份提供方修改密码。</p>
            <div class="field"><label for="oldPwd">当前密码</label><input id="oldPwd" type="password" autocomplete="current-password" /></div>
            <div class="field"><label for="newPwd">新密码</label><input id="newPwd" type="password" autocomplete="new-password" /></div>
            <div class="field"><label for="newPwd2">确认新密码</label><input id="newPwd2" type="password" autocomplete="new-password" /></div>
            <label class="checkline"><input type="checkbox" checked /> 修改后注销其它设备的会话</label>
            <div class="savebar"><button class="ghost-btn" type="button" style="width:auto;margin:0">取消</button><button class="auth-btn" type="button" style="width:auto;margin:0" data-save>更新密码</button></div>
          </div>

          <div class="account-panel" data-pane="security">
            <h1>登录安全</h1>
            <p>查看当前登录设备、登录方式和最近安全事件。</p>
            <table class="mini-table">
              <thead><tr><th>设备</th><th>地点</th><th>登录方式</th><th>状态</th></tr></thead>
              <tbody>
                <tr><td>Chrome on macOS</td><td>上海</td><td>账号密码</td><td>当前设备</td></tr>
                <tr><td>Safari on iPhone</td><td>上海</td><td>SSO</td><td><button class="ghost-btn" type="button" style="width:auto;height:30px;margin:0">注销</button></td></tr>
              </tbody>
            </table>
          </div>

          <div class="account-panel" data-pane="notify">
            <h1>通知偏好</h1>
            <p>这里只管理个人通知，不影响工作区级别的审计和告警策略。</p>
            <label class="checkline"><input type="checkbox" checked /> 看板分享和评论通过站内信提醒</label>
            <label class="checkline"><input type="checkbox" checked /> 知识审核结果通过邮件提醒</label>
            <label class="checkline"><input type="checkbox" /> 每周发送我的问数摘要</label>
            <div class="savebar"><button class="auth-btn" type="button" style="width:auto;margin:0" data-save>保存偏好</button></div>
          </div>
        </section>
      </div>
    </main>
  </div>
</div>
<script src="./shared/shell.js"></script>
<script>
  function activate(tab) {
    document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
    document.querySelectorAll('[data-pane]').forEach((p) => p.classList.toggle('on', p.dataset.pane === tab));
  }
  document.querySelectorAll('[data-tab]').forEach((btn) => {
    btn.onclick = () => {
      activate(btn.dataset.tab);
      history.replaceState(null, '', '#' + btn.dataset.tab);
    };
  });
  document.querySelectorAll('[data-save]').forEach((btn) => {
    btn.onclick = () => window.odToast && odToast(btn.textContent + ' · 演示');
  });
  const initial = location.hash.replace('#', '');
  if (initial) activate(initial);
</script>
</body>
</html>
