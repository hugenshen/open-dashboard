<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Open Dashboard 高保</title>
  <script>
    (function () {
      const pages = {
        workbench: 'workbench.html',
        conversation: 'conversation.html',
        datasource: 'datasource.html',
        dataset: 'dataset.html',
        dashboard: 'dashboard.html',
        report: 'report.html'
      };
      const raw = (location.hash || '').replace(/^#\/?/, '').trim();
      const parts = raw.split('/').filter(Boolean);
      const known = pages[parts[0]];
      const mod = known ? parts[0] : (parts[0] ? 'dashboard' : 'workbench');
      const rest = known ? parts.slice(1) : parts;
      const dest = rest.length ? './' + pages[mod] + '#/' + rest.join('/') : './' + pages[mod];
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>页面已按模块拆分，正在跳转… <a href="./workbench.html">工作台</a></p>
</body>
</html>
