openapi: 3.0.3
info:
  title: Open Dashboard API
  version: 0.5.0-conversation
  description: |
    Core APIs: dashboard editor, chartQuery + datasetQuery, mobile layout, report (Umo charts),
    conversation (内测). Auth resources: DASHBOARD, REPORT, CONVERSATION. IDs are strings in JSON.
servers:
  - url: /api
tags:
  - name: dashboardTree
  - name: dashboard
  - name: chartQuery
  - name: datasetQuery
  - name: report
  - name: datasource
  - name: dataset
  - name: catalog
  - name: auth
  - name: workspace
  - name: dataPlaza
  - name: conversation

paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Password login and create HttpOnly session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: OK; sets OD_SESSION HttpOnly SameSite=Lax cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeVO'
        '401':
          description: Invalid username or password
  /auth/register:
    post:
      tags: [auth]
      summary: Register a local password account and create HttpOnly session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: OK; sets OD_SESSION HttpOnly SameSite=Lax cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeVO'
        '400':
          description: Invalid request or duplicated username
  /auth/sso/providers:
    get:
      tags: [auth]
      summary: List configured SSO providers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SsoProvider'
  /auth/sso/{provider}/start:
    get:
      tags: [auth]
      summary: Start OIDC authorization-code login for Google or enterprise SSO
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: redirect
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect to provider authorization endpoint; sets OD_SSO_STATE HttpOnly cookie
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        '401':
          description: Provider not configured
  /auth/sso/{provider}/callback:
    get:
      tags: [auth]
      summary: Complete OIDC callback and create OD_SESSION
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: false
          schema: { type: string }
        - name: state
          in: query
          required: false
          schema: { type: string }
        - name: error
          in: query
          required: false
          schema: { type: string }
      responses:
        '302':
          description: Redirect back to product route; sets OD_SESSION and clears OD_SSO_STATE
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        '401':
          description: Invalid state, expired state or provider identity failure
  /auth/me:
    get:
      tags: [auth]
      summary: Get current principal, workspace and effective governance context
      description: |
        Identity is resolved from the OD_SESSION HttpOnly cookie. Service-to-service
        internal calls may use `X-OD-Internal-Token` plus gateway identity headers.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeVO'
        '401':
          description: Missing, expired or revoked session
  /auth/menus:
    get:
      tags: [auth]
      summary: List table-governed navigation menus visible to the current principal
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'
        '401':
          description: Missing, expired or revoked session
  /auth/workspace:
    post:
      tags: [auth]
      summary: Switch current session workspace after membership validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchWorkspaceRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeVO'
        '403':
          description: User is not a member of the requested workspace
  /auth/password:
    post:
      tags: [auth]
      summary: Change current user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '403':
          description: Old password does not match
  /auth/logout:
    post:
      tags: [auth]
      summary: Revoke current session and clear session cookie
      responses:
        '200':
          description: OK; clears OD_SESSION cookie
          headers:
            Set-Cookie:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
  /workspaces:
    get:
      tags: [workspace]
      summary: List workspaces visible to current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceVO'
  /workspaces/{workspaceId}/summary:
    get:
      tags: [workspace]
      summary: Get workspace governance summary
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceSummaryVO'
        '403':
          description: Workspace is not visible to current user
  /workspaces/{workspaceId}/groups:
    get:
      tags: [workspace]
      summary: List workspace groups
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceGroupVO'
  /workspaces/{workspaceId}/members:
    get:
      tags: [workspace]
      summary: List workspace members
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceMemberVO'
  /workspaces/{workspaceId}/roles:
    get:
      tags: [workspace]
      summary: List workspace roles and permission bundles
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkspaceRoleVO'
  /workspaces/{workspaceId}/effective-permissions:
    get:
      tags: [workspace]
      summary: Get effective permissions in the active workspace
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectivePermissionVO'
  /workspaces/{workspaceId}/data-plaza:
    get:
      tags: [dataPlaza]
      summary: List visible data assets and user's consumption state
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPlazaVO'
  /workspaces/{workspaceId}/data-plaza/{assetId}/add:
    post:
      tags: [dataPlaza]
      summary: Add an authorized asset to "My Data"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
        - name: assetId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataAssetVO'
        '403':
          description: Asset is not authorized for consumption
  /workspaces/{workspaceId}/dataset-requests:
    post:
      tags: [dataPlaza]
      summary: Request permission to consume a data asset
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataRequestCreateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataRequestVO'
  /conversations/styles:
    get:
      tags: [conversation]
      summary: List visual style presets for conversation generation
      responses:
        '200':
          description: OK
        '404':
          description: Conversation feature disabled
  /conversations:
    get:
      tags: [conversation]
      summary: List conversations for current user
      description: |
        Persisted in `de_conversation`. Workbench recent-asks uses `limit`.
        Ordered by updateTime descending.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50 }
          description: Cap for workbench chips; omit for the full list
      responses:
        '200':
          description: OK
        '404':
          description: Conversation feature disabled
    post:
      tags: [conversation]
      summary: Create conversation
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                datasetIds:
                  type: array
                  items: { type: string }
                linkedDashboardId: { type: string }
      responses:
        '200':
          description: OK
  /conversations/{id}:
    get:
      tags: [conversation]
      summary: Get conversation detail
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: Not found
    patch:
      tags: [conversation]
      summary: Update conversation meta
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
    delete:
      tags: [conversation]
      summary: Delete conversation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: No Content
  /conversations/{id}/messages:
    get:
      tags: [conversation]
      summary: List messages
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
        '404':
          description: Not found
    post:
      tags: [conversation]
      summary: Append a message (ask history)
      description: User questions are stored on send so workbench can list recent asks from the table.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                role: { type: string, enum: [user, assistant, system], default: user }
                content: { type: string }
                attachments:
                  type: array
                  description: "Assistant 消息可携带思考过程 trace（{kind: 'trace', steps: [...]}）和问数结果（{kind: 'answer', table/chart/insight/clarify}），历史会话回溯用"
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: OK
        '404':
          description: Not found
  /conversations/{id}/runs:
    post:
      tags: [conversation]
      deprecated: true
      summary: "[DEPRECATED] Use harness POST /harness/v1/conversations/{id}/runs"
      description: |
        Java entry retired (HTTP 410). Frontend must call opendashboard-harness via Vite
        proxy `/harness` → `:8091`. See docs/proposals/P004-conversation/harness-design.md.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                intent: { type: string, enum: [ask, insight, gen], description: "默认 ask；可省略由服务端从 message 推断" }
                mode: { type: string, enum: [auto, plan] }
                styleId: { type: string }
                datasetIds:
                  type: array
                  items: { type: string }
                selectedChartId: { type: string }
                selectedEncode: { type: object }
      responses:
        '410':
          description: Gone — use harness direct SSE
        '200':
          description: |
            (legacy) SSE stream. Named events: run, step, plan, patch, chart_ready,
            intent_map, answer_sql, answer_table, answer_chart, answer_insight, answer_clarify,
            message_delta, error, finish.
            ask/insight 结束于 finish.reason=answered；gen 结束于 done / awaiting_confirm.
            intent_map 给出短语→字段对齐；unresolved 非空时问数应澄清而非盲查。
            Ask-3（SQLBot）：answer_sql 为校验后的只读 SQL（会话预览，不写画布）。
            step 可带 preview（kind=schema|sql|query|profile）与 parent（如 sqlbot）供思考过程嵌套展示字段/SQL/抽样。
  /conversations/{id}/runs/{runId}/cancel:
    post:
      tags: [conversation]
      summary: Cancel a streaming run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
  /conversations/{id}/runs/{runId}/confirm-plan:
    post:
      tags: [conversation]
      summary: Confirm plan mode and continue apply
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: SSE stream continuation
  /harness/v1/conversations/{id}/runs:
    post:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness direct run
      description: |
        Public Harness AI run entrypoint. Frontend calls it through the `/harness`
        proxy. Harness owns SSE, run trace, runtime context assembly and tool
        orchestration; Java public run entry is retired.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-User-Id
          in: header
          required: false
          schema: { type: string }
        - name: X-User-Perms
          in: header
          required: false
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
          description: Harness workspace scope; defaults to `default` for existing single-workspace runs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string }
                intent: { type: string, enum: [ask, insight, gen] }
                mode: { type: string, enum: [auto, plan], default: auto }
                styleId: { type: string }
                datasetIds:
                  type: array
                  items: { type: string }
                selectedChartId: { type: string }
                selectedEncode: { type: object }
      responses:
        '200':
          description: |
            SSE stream. Named events: run, step, plan, patch, chart_ready,
            intent_map, answer_sql, answer_table, answer_chart, answer_insight,
            answer_clarify, message_delta, error, finish.
        '400':
          description: Invalid conversation or workspace id
        '404':
          description: Conversation not found in current owner/workspace scope
  /harness/v1/conversations/{id}/runs/{runId}/cancel:
    post:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness cancel run
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
        '404':
          description: Conversation not found in current owner/workspace scope
  /harness/v1/conversations/{id}/runs/{runId}/confirm-plan:
    post:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness confirm plan mode and continue apply
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: SSE stream continuation
        '404':
          description: Conversation not found in current owner/workspace scope
  /harness/v1/conversations/{id}/runs/{runId}/adopt:
    post:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness adopt ask result into dashboard draft
      description: |
        Saves an answered ask run into a dashboard draft through Java internal
        apply. The Java public adopt boundary is removed; frontend calls Harness.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action: { type: string, enum: [save, generate], default: save }
                styleId: { type: string }
      responses:
        '200':
          description: SSE stream. May emit patch, chart_ready, board_ready, message_delta, error, finish.
        '404':
          description: Conversation or run not found in current owner/workspace scope
        '409':
          description: Run has no adoptable artifact
  /harness/v1/conversations/{id}/replay:
    get:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness conversation replay
      description: |
        History hydrate payload. Returns each run's recorded SSE events and ask
        artifacts so the frontend can restore thinking steps and result cards
        without re-POSTing /runs.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId: { type: string }
                  linkedDashboardId: { type: string, nullable: true }
                  runs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '404':
          description: Conversation not found in current owner/workspace scope
  /harness/v1/conversations/{id}/runs/{runId}/trace:
    get:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness run trace
      description: |
        Harness public read model for a run. The endpoint returns recorded SSE
        events plus run status, artifact, pending plan, knowledgeRefs and memoryRefs.
        Frontend calls it through the `/harness` proxy; Java internal APIs are not exposed.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: runId
          in: path
          required: true
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  conversationId: { type: string }
                  runId: { type: string }
                  status: { type: string }
                  finishDetail: { type: string, nullable: true }
                  eventCount: { type: integer }
                  events:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  artifact:
                    type: object
                    additionalProperties: true
                  pending:
                    type: object
                    nullable: true
                    additionalProperties: true
                  knowledgeRefs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  memoryRefs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
        '404':
          description: Conversation or run not found
  /harness/v1/memory:
    get:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness user memory status
      description: |
        Returns current user's Harness memory in the selected workspace. Memory
        is owned by Harness and scoped by workspace plus user.
      parameters:
        - name: X-User-Id
          in: header
          required: false
          schema: { type: string }
        - name: X-User-Perms
          in: header
          required: false
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string }
                  workspaceId: { type: string }
                  facts:
                    type: array
                    items: { type: string }
  /harness/v1/knowledge/{datasetId}:
    get:
      tags: [conversation]
      servers:
        - url: /
      summary: Harness local dataset knowledge
      description: |
        Reads dataset glossary and SQL examples in the selected workspace. This
        is the current local Harness store and will later be bounded by Java
        active knowledgeRefs.
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
        - name: X-User-Id
          in: header
          required: false
          schema: { type: string }
        - name: X-User-Perms
          in: header
          required: false
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      responses:
        '200':
          description: OK
        '400':
          description: Invalid dataset or workspace id
        '403':
          description: Missing conversation:use or dataset:use
    put:
      tags: [conversation]
      servers:
        - url: /
      summary: Update Harness local dataset knowledge
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
        - name: X-User-Id
          in: header
          required: false
          schema: { type: string }
        - name: X-User-Perms
          in: header
          required: false
          schema: { type: string }
        - name: X-Workspace-Id
          in: header
          required: false
          schema: { type: string, default: default }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                glossary:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                examples:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '200':
          description: OK
        '400':
          description: Invalid dataset or workspace id
        '403':
          description: Missing dataset manage permission
  /harness/v1/datasets/{datasetId}/review-fields:
    post:
      tags: [dataset]
      servers:
        - url: /
      summary: LLM 复核字段角色（自学习第二段）
      description: |
        读取 Java schema（含规则角色与采样），调用 interpret_fields_llm。
        不改 Java 库；由 POST /api/dataset/{id}/learn 落库。内部令牌 X-OD-Internal-Token。
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: { type: string }
        - name: X-OD-Internal-Token
          in: header
          required: true
          schema: { type: string }
        - name: X-User-Id
          in: header
          required: false
