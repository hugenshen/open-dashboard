              $ref: '#/components/schemas/ChartQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sql: { type: string }
                  dialect: { type: string }

  /datasetQuery/execute:
    post:
      tags: [datasetQuery]
      summary: Execute QuerySpec against a dataset (sole data-source entry)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DatasetQueryRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetQueryResult'

  /report:
    get:
      tags: [report]
      summary: List reports
      description: Ordered by updateTime descending. Workbench recent reports uses `limit`.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50 }
          description: Cap for workbench recent reports (home shows 4); omit for the full list
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportMetaVO'
    post:
      tags: [report]
      summary: Create report
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailVO'

  /report/{id}:
    get:
      tags: [report]
      summary: Get report meta + draft content JSON
      description: |
        Returns draft document. Content is Umo/Tiptap JSON and must not embed query result rows.
        reportChart nodes use attrs documented in ReportChartAttrs.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailVO'
        '404':
          description: Not found
    patch:
      tags: [report]
      summary: Update report metadata (e.g. name)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                folder: { type: string }
                desc: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportMetaVO'
        '404':
          description: Not found
    delete:
      tags: [report]
      summary: Delete report and its document copies
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found

  /report/{id}/doc:
    put:
      tags: [report]
      summary: Save report document JSON (Umo/Tiptap)
      description: |
        Persists draft content_json only (text + reportChart attrs).
        Do not persist chartQuery ResultTable / rows inside content.
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportDocSaveRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailVO'
        '409':
          description: contentId conflict

  /report/{id}/publish:
    post:
      tags: [report]
      summary: Publish draft to published copy
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailVO'

  /report/{id}/discardDraft:
    post:
      tags: [report]
      summary: Discard draft and restore from published
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportDetailVO'
        '400':
          description: No published copy to restore

  /dashboard/{id}/share:
    post:
      tags: [dashboard]
      summary: Create share link (Phase A)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                visibility: { type: string, enum: [public, org] }
                permission: { type: string, enum: [view, edit] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  url: { type: string }
                  visibility: { type: string }
                  permission: { type: string }

  /dashboard/{id}/export:
    post:
      tags: [dashboard]
      summary: Export chart CSV or canvas PNG (Phase A)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [csv, png] }
                chartId: { type: string }
      responses:
        '200':
          description: file payload

  /dashboard/{id}/alerts:
    get:
      tags: [dashboard]
      summary: List KPI alerts (Phase C)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
    put:
      tags: [dashboard]
      summary: Replace KPI alerts
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /dashboard/{id}/jumps:
    get:
      tags: [dashboard]
      summary: List jump configs (Phase C)
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
    put:
      tags: [dashboard]
      summary: Replace jump configs
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK

  /share/{token}:
    get:
      tags: [dashboard]
      summary: Public/org view by share token
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: published dashboard detail

  /embed/{token}:
    get:
      tags: [dashboard]
      summary: Embeddable published view (Phase C)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: HTML embed surface

components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
        workspaceId: { type: string }

    RegisterRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        displayName: { type: string }
        email: { type: string, format: email }
        workspaceId: { type: string }

    ChangePasswordRequest:
      type: object
      required: [oldPassword, newPassword]
      properties:
        oldPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 8, maxLength: 128 }

    SwitchWorkspaceRequest:
      type: object
      required: [workspaceId]
      properties:
        workspaceId: { type: string }

    SsoProvider:
      type: object
      properties:
        id: { type: string }
        label: { type: string }
        ready: { type: boolean }

    AuthMeVO:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        permissions:
          type: array
          items: { type: string }
        workspaceId: { type: string }
        currentWorkspace:
          $ref: '#/components/schemas/WorkspaceVO'
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceVO'
        groups:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceGroupVO'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceRoleVO'
        effectivePermissions:
          type: array
          items: { type: string }

    MenuItem:
      type: object
      properties:
        key: { type: string }
        label: { type: string }
        path: { type: string }
        group: { type: string, enum: [use, manage] }

    WorkspaceVO:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        mode: { type: string, enum: [team, shared, personal] }
        role: { type: string }
        current: { type: boolean }
        memberCount: { type: integer }
        assetCount: { type: integer }

    WorkspaceSummaryVO:
      type: object
      properties:
        workspace:
          $ref: '#/components/schemas/WorkspaceVO'
        groupCount: { type: integer }
        memberCount: { type: integer }
        roleCount: { type: integer }
        assetCount: { type: integer }
        myDataCount: { type: integer }
        pendingRequestCount: { type: integer }
        adminTasks:
          type: array
          items: { type: string }

    WorkspaceGroupVO:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        memberCount: { type: integer }
        roles:
          type: array
          items: { type: string }

    WorkspaceRoleVO:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        description: { type: string }
        permissions:
          type: array
          items: { type: string }

    WorkspaceMemberVO:
      type: object
      properties:
        userId: { type: string }
        displayName: { type: string }
        status: { type: string, enum: [active, invited, disabled] }
        groups:
          type: array
          items: { type: string }
        roles:
          type: array
          items: { type: string }

    EffectivePermissionVO:
      type: object
      properties:
        workspaceId: { type: string }
        userId: { type: string }
        permissions:
          type: array
          items: { type: string }
        datasetScopes:
          type: array
          items: { type: string }

    DataPlazaVO:
      type: object
      properties:
        currentWorkspace:
          $ref: '#/components/schemas/WorkspaceVO'
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/DataSpaceVO'
        assets:
          type: array
          items:
            $ref: '#/components/schemas/DataAssetVO'
        myData:
          type: array
          items:
            $ref: '#/components/schemas/DataAssetVO'
        requests:
          type: array
          items:
            $ref: '#/components/schemas/DataRequestVO'

    DataSpaceVO:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        assetCount: { type: integer }
        joined: { type: boolean }

    DataAssetVO:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        type: { type: string, enum: [dataset, dashboard, combo, file, api] }
        workspaceId: { type: string }
        workspaceName: { type: string }
        owner: { type: string }
        description: { type: string }
        source: { type: string }
        sensitiveLevel: { type: string, enum: [low, medium, high] }
        authStatus: { type: string, enum: [granted, requestable, pending, denied] }
        added: { type: boolean }
        tags:
          type: array
          items: { type: string }
        updatedAt: { type: integer, format: int64 }
        actions:
          type: array
          items: { type: string, enum: [ask, open, add, request, manage] }

    DataRequestCreateRequest:
      type: object
      required: [assetId, purpose]
      properties:
        assetId: { type: string }
        purpose: { type: string }
        expireDays: { type: integer }
        requestedActions:
          type: array
          items: { type: string }

    DataRequestVO:
      type: object
      properties:
        id: { type: string }
        assetId: { type: string }
        assetName: { type: string }
        workspaceId: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        approver: { type: string }
        createdAt: { type: integer, format: int64 }
        purpose: { type: string }
        requestedActions:
          type: array
          items: { type: string }

    DatasetQuestionVO:
      type: object
      properties:
        id: { type: integer }
        datasetId: { type: string }
        question: { type: string }
        sql: { type: string }
        chartType: { type: string }
        brief: { type: string }
        status: { type: string, enum: [active, disabled] }
        hitCount: { type: integer }
        createdAt: { type: integer }
        updatedAt: { type: integer }
    QuestionUpsertRequest:
      type: object
      required: [question, sql]
      properties:
        datasetId: { type: string }
        question: { type: string }
        sql: { type: string }
        chartType: { type: string }
        brief: { type: string }
        status: { type: string, enum: [active, disabled] }
    BusiNodeRequest:
      type: object
      properties:
        busiFlag:
          type: string
          example: dashboard
        id:
          type: string

    BusiNodeVO:
      type: object
      properties:
        id: { type: string }
        pid: { type: string }
        name: { type: string }
        nodeType: { type: string, enum: [folder, dashboard] }
        leaf: { type: boolean }
        weight: { type: integer }
        children:
          type: array
          items:
            $ref: '#/components/schemas/BusiNodeVO'

    DashboardCreateRequest:
      type: object
      required: [pid, name, nodeType]
      properties:
        pid: { type: string }
        name: { type: string }
        nodeType: { type: string, enum: [folder, dashboard] }
        layoutMode: { type: string, enum: [grid, free], default: grid }

    DashboardRenameRequest:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    DashboardMoveRequest:
      type: object
      required: [id, pid]
      properties:
        id: { type: string }
        pid: { type: string }

    DashboardNodeVO:
      type: object
      properties:
        id: { type: string }
        pid: { type: string }
        name: { type: string }
        nodeType: { type: string }
        status: { type: string, enum: [draft, published, publishedWithDraft] }
        layoutMode: { type: string }
        contentId: { type: string }
        version: { type: integer }
        updateTime: { type: integer, format: int64 }

    DashboardBarVO:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        nodeType: { type: string }
        status: { type: string }
        createBy: { type: string }
        createTime: { type: integer, format: int64 }
        updateBy: { type: string }
        updateTime: { type: integer, format: int64 }
        chartCount: { type: integer }

    DashboardLayoutVO:
      type: object
      properties:
        gridCols: { type: integer }
        gridRows: { type: integer }
        themeRef: { type: string }
        refreshSec: { type: integer }
        extStyle: { type: object }
        mobile:
          type: object
          description: Independent mobile layout (v0.2+); persisted as mobile_json
          properties:
            enabled: { type: boolean }
            device: { type: string }
            bg: { type: string }
            components:
              type: array
              items:
                type: object
                properties:
                  id: { type: string }
                  refId: { type: string }
                  x: { type: integer }
                  y: { type: integer }
                  w: { type: integer }
                  h: { type: integer }
                  z: { type: integer }
                  styleSync: { type: boolean }
                  style: { type: object }

    DashboardComponentVO:
      type: object
      properties:
        id: { type: string }
        type: { type: string, enum: [chart, filter, text, image, tabs] }
        parentId: { type: string }
        chartViewId: { type: string }
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }
        zIndex: { type: integer }
        props: { type: object }

    ChartViewVO:
      type: object
      properties:
        id: { type: string }
        dashboardId: { type: string }
        datasetId: { type: string }
        chartType: { type: string }
        title: { type: string }
        encode: { type: object }
        style: { type: object }
        senior: { type: object }

    DashboardLinkageVO:
      type: object
      properties:
        id: { type: string }
        sourceChartId: { type: string }
        sourceField: { type: string }
        targetChartId: { type: string }
        targetField: { type: string }
        enabled: { type: boolean }

    DashboardDetailVO:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/DashboardNodeVO'
        layout:
          $ref: '#/components/schemas/DashboardLayoutVO'
        components:
          type: array
          items:
            $ref: '#/components/schemas/DashboardComponentVO'
        charts:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChartViewVO'
        linkages:
          type: array
          items:
            $ref: '#/components/schemas/DashboardLinkageVO'

    DashboardLayoutUpdateRequest:
      type: object
      required: [contentId]
      properties:
        gridCols: { type: integer }
        gridRows: { type: integer }
        themeRef: { type: string }
        refreshSec: { type: integer }
        extStyle: { type: object }
        contentId: { type: string }

    DashboardComponentsUpdateRequest:
      type: object
      required: [contentId]
      properties:
        upsert:
          type: array
          items:
            $ref: '#/components/schemas/DashboardComponentVO'
        deleteIds:
          type: array
          items: { type: string }
        contentId: { type: string }

    ChartViewSaveRequest:
      type: object
      required: [chartType, encode, contentId]
      properties:
        datasetId: { type: string, nullable: true }
        chartType: { type: string }
        title: { type: string }
        encode: { type: object }
        style: { type: object }
        senior: { type: object }
        contentId: { type: string }

    DashboardStatusVO:
      type: object
      properties:
        id: { type: string }
        status: { type: string, enum: [draft, published, publishedWithDraft] }
        contentId: { type: string }
        version: { type: integer }

    ChartQueryRequest:
      type: object
      required: [context]
      description: |
        Board chart: dashboardId + chartId (+ view).
        Report inline / unsaved preview: omit dashboardId and provide inline
        (datasetId + chartType + encode). Style never enters SQL.
        Report NodeViews SHOULD set client=report.
      properties:
        chartId: { type: string }
        dashboardId: { type: string, nullable: true }
        view: { type: string, enum: [draft, published], default: published }
        client: { type: string, enum: [dashboard, report], description: optional audit hint }
        inline:
          $ref: '#/components/schemas/ChartInlineSpec'
        context:
          type: object
          properties:
            filters:
              type: array
              items:
                type: object
                properties:
                  componentId: { type: string }
                  field: { type: string }
                  operator: { type: string }
                  value: {}
            linkages:
              type: array
              items:
                type: object
                properties:
                  sourceChartId: { type: string }
                  sourceField: { type: string }
                  value: {}
                  targetChartId: { type: string }
                  targetField: { type: string }
      example:
        client: report
        dashboardId: null
        inline:
          datasetId: ds_sales
          chartType: bar
          encode: { category: city, value: amount, agg: SUM, format: thousand }
        context: { filters: [], linkages: [] }

    ChartQueryResult:
      type: object
      properties:
        fields:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              type: { type: string }
        data:
          type: array
          items:
            type: array
            items: {}
        series: { type: object }
        extra: { type: object }

    DatasetQueryRequest:
      type: object
      required: [datasetId]
      properties:
        datasetId: { type: string }
        dimensions:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
        measures:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              agg: { type: string, enum: [SUM, AVG, COUNT, MAX, MIN, COUNT_DISTINCT] }
        columns:
          type: array
          items: { type: string }
          description: Raw column projection (table chart); mutually exclusive with agg path when used alone
        filters:
          type: object
          description: |
            Filter AST. Intent-derived relative time is `{items:[{field,op:last,n,unit}]}`.
            Field names must be schema identifiers. Compiled into SQL WHERE by datasetQuery.
            Dashboard query-bar widgets inject here via chartQuery.context.filters
            (eq / in / between / last). Intent encode.filters merge with the same AST.
        limit: { type: integer }
        options:
          type: object
          properties:
            includeSql: { type: boolean }
            timeoutMs: { type: integer }

    DatasetQueryResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              dataType: { type: string }
              field: { type: string }
              agg: { type: string }
        rows:
          type: array
          items:
            type: array
            items: {}
        truncated: { type: boolean }
        sql: { type: string }
        elapsedMs: { type: integer }

    ChartInlineSpec:
      type: object
      required: [datasetId, chartType, encode]
      description: Report-only or unsaved chart config; never written to de_chart_view
      properties:
        datasetId: { type: string }
        chartType: { type: string }
        encode:
          type: object
          description: category / value / agg; optional filters from intent (relative time)
        style: { type: object }
        senior: { type: object }

    ReportChartAttrs:
      type: object
      description: |
        Attrs of Tiptap node type reportChart inside report content_json.
        source=dashboard requires dashboardId+chartId; source=inline requires datasetId+chartType+encode.
        Query results must not be stored here.
      required: [id, source]
      properties:
        id: { type: string }
        source: { type: string, enum: [dashboard, inline] }
        dashboardId: { type: string, nullable: true }
        chartId: { type: string, nullable: true }
        view: { type: string, enum: [published, draft], default: published }
        datasetId: { type: string, nullable: true }
        chartType: { type: string }
        encode: { type: object }
        style: { type: object }
        senior: { type: object }
        title: { type: string }
        width:
          oneOf:
            - { type: string, enum: [full, half] }
            - { type: number }
        height: { type: number, description: px }

    ReportDocSaveRequest:
      type: object
      required: [content, contentId]
      properties:
        content:
          type: object
          description: Umo/Tiptap JSON; may contain reportChart nodes (see ReportChartAttrs)
        contentId: { type: string }

    ReportMetaVO:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        folder: { type: string }
        desc: { type: string }
        status: { type: string, enum: [draft, published, publishedWithDraft] }
        contentId: { type: string }
        version: { type: integer }
        updateTime: { type: integer, format: int64 }

    ReportDetailVO:
      type: object
      properties:
        meta:
          $ref: '#/components/schemas/ReportMetaVO'
        content:
          type: object
          description: |
            Umo/Tiptap JSON document (draft on GET /report/{id}).
            Must not embed chart query rows; charts live as reportChart attrs only.
