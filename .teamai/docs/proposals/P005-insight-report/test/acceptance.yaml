proposal: P005
items:
  - id: PR-INS-01
    title: 从看板生成报告草稿
    gate: acceptance
    criterion: 用户可从有权限的看板或数据集创建新的洞察报告 draft。
    method: ui
    command_or_path: /dashboards/{id}
    expected: 新报告可在 Umo 编辑器继续编辑。
    evidence: ""
    status: todo
    blocker_of_done: true
    requirements_target: PR-INS-01
  - id: PR-INS-02
    title: 洞察产物不持久化结果行
    gate: code
    criterion: 叙事块只保存文本、来源和图表引用，不保存 ResultTable。
    method: script
    command_or_path: report persistence tests
    expected: 文档 JSON 无业务结果行。
    evidence: ""
    status: todo
    blocker_of_done: true
    requirements_target: PR-INS-02
  - id: PR-INS-03
    title: 洞察可追溯
    gate: acceptance
    criterion: 每条洞察可定位到数据集字段、图表 encode 或查询修订。
    method: ui
    command_or_path: /reports/{id}/edit
    expected: 用户可查看来源，不产生无证据结论。
    evidence: ""
    status: todo
    blocker_of_done: true
    requirements_target: PR-INS-03
  - id: PR-INS-04
    title: 失败降级
    gate: acceptance
    criterion: 模型或算法失败时生成可编辑模板并展示失败原因。
    method: ui
    command_or_path: /reports/{id}/edit
    expected: 页面不白屏、不写入伪造洞察。
    evidence: ""
    status: todo
    blocker_of_done: true
    requirements_target: PR-INS-04
  - id: PR-INS-05
    title: 洞察权限
    gate: acceptance
    criterion: 新建或刷新洞察必须有 dataset:use，静态报告查看权不继承问数权。
    method: api
    command_or_path: insight generation endpoint
    expected: 无权请求被拒绝且不触发查询。
    evidence: ""
    status: todo
    blocker_of_done: true
    requirements_target: PR-INS-05
