# P013 acceptance — 仪表盘页面模板
proposal: P013
status: in-progress

items:
  - id: PR-TPL-01
    title: 评审接受模板市场 + 变量主题 + 模板自带多端
    gate: proposal
    criterion: 产品接受「页面模板=仪表盘稿面；交互学 DataEase；不引入 @tabler/core；空白板仍走 P001 C 档」。
    method: manual
    command_or_path: .teamai/docs/proposals/P013-dashboard-page-templates/README.md
    expected: 文首 status 为 accepted 或 in-progress，并出现在 roadmap/in-progress。
    evidence: "2026-08-23 用户要求对照 Tabler 三点 + DataEase 模板交互，统一更新高保并冻结上一版"
    status: pass
    blocker_of_done: true
    requirements_target: null

  - id: PR-TPL-02
    title: 新建走模板市场且不少于 20 张可分类搜索
    gate: hi-fi
    criterion: 仪表盘「+ 新建」与工作台「新建看板」进入模板市场而非直接空白画布。目录卡片 ≥20；左侧分类与搜索可过滤。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html#/templates
    expected: 打开市场可见 ≥20 张；切「销售」只留销售类；搜索「库存」命中库存周转。
    evidence: "2026-08-23 手验 dashboard.html#/templates：24 张；销售分类 4 张（销售分析/区域作战/渠道对比/产品贡献）；搜「库存」命中库存周转。工作台「新建看板」href=./dashboard.html#/templates；列表 #btnNew → screen=templates"
    status: pass
    blocker_of_done: true
    requirements_target: PR-DASH-03

  - id: PR-TPL-03
    title: Quick BI 质感市场：浮卡、封面悬停预览/应用、全页预览
    gate: hi-fi
    criterion: 市场页有渐变舞台与浮卡网格（无本月精选 Hero）；卡片软阴影无硬描边；悬停封面中央出现「预览」「应用」；预览为全页（非小弹窗），可返回市场。封面图种与应用后稿面同族（柱/条/线/饼/表），无封面独有仪表盘/地图。交互仍含左分类与搜索。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html?v=p013t14#/templates
    expected: 首屏为分类网格与「预览/应用」；无本月精选；网格卡悬停封面中央出按钮；预览头栏可返回市场并应用。
    evidence: "2026-08-23 t12 手验 http://127.0.0.1:8765/dashboard.html?v=p013t12#/templates ：无本月精选；封面无 72 仪表盘/气泡图；促销监控封面为 KPI+冲刺榜/分时+排行/趋势/饼，应用后无仪表盘。"
    status: pass
    blocker_of_done: true
    requirements_target: null

  - id: PR-TPL-04
    title: 模板应用后移动端已启用无需再勾选上板
    gate: hi-fi
    criterion: 应用非 blank 模板后进入编辑器，切换「移动布局」可见已铺组件；mobile.enabled 为 true。blank 不自动启用移动端。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html#/templates
    expected: 应用「销售分析」后移动画布有 KPI/图；应用空白后移动端未启用或为空。
    evidence: "2026-08-23 手验：应用销售分析 → editor，mobile.enabled=true 且 13 个移动组件；Phase B 切移动布局 13 widget。应用空白 → enabled=false、components=[]"
    status: pass
    blocker_of_done: true
    requirements_target: PR-DASH-11

  - id: PR-TPL-05
    title: CSS 变量可切明暗与品牌色
    gate: hi-fi
    criterion: 外观菜单可切浅色/深色，并可切至少 3 个品牌色；主按钮与强调色跟随 --od-brand，刷新后 localStorage 保持。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/workbench.html
    expected: 切飞书蓝后主按钮与侧栏选中态变蓝；切深色后页面背景变暗。
    evidence: "2026-08-23 手验 workbench：外观菜单有浅色/深色侧栏/深色 + Indigo/飞书蓝/Tabler/青绿。飞书蓝 --od-brand=#3370ff，问数按钮 rgb(51,112,255)，侧栏选中同色；Tabler #066fd1；青绿 #0ca678。深色 --od-bg=#111318。刷新后 localStorage od.theme/od.brand 保持"
    status: pass
    blocker_of_done: true
    requirements_target: null

  - id: PR-TPL-06
    title: 阅读态去掉类型角标与灰标题栏
    gate: hi-fi
    criterion: 已发布预览中图表卡右上角不出现 bar/pie/line 字样；标题栏无 #fafbfc 灰底。编辑态仍可看到类型角标。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html
    expected: 预览只读卡头为透明；编辑选中图仍显示类型。
    evidence: "2026-08-23 手验：编辑态图卡角标 bar/line/pie/area。#/preview/dash_ops 的 .board.preview-readonly 无 bar/pie/line 字样，.hd 背景 rgba(0,0,0,0)"
    status: pass
    blocker_of_done: true
    requirements_target: null

  - id: PR-TPL-07
    title: 空白画布仍可走 P001 C 档手改移动布局
    gate: hi-fi
    criterion: 从空白模板创建后，仍可打开 PC/移动布局切换、勾选上板；不删除 C 档能力。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html
    expected: 空白板编辑器顶栏仍有 PC布局 / 移动布局。
    evidence: "2026-08-23 手验：空白模板应用后 Phase B 顶栏仍有 PC布局/移动布局；切移动布局提示「从左侧勾选组件上板」，mobile.components 仍为空（C 档未删）"
    status: pass
    blocker_of_done: true
    requirements_target: PR-DASH-11

  - id: PR-TPL-08
    title: 开工前 hi-fi 已冻结 increment 快照
    gate: hi-fi
    criterion: VERSIONS.md 有 2026-08-23-pre-p013，kind=increment，snapshots 目录只读。
    method: manual
    command_or_path: .teamai/docs/prototypes/VERSIONS.md
    expected: 快照存在且后续改动只发生在 hi-fi/。
    evidence: "2026-08-23 ./snapshot.sh 2026-08-23-pre-p013 increment"
    status: pass
    blocker_of_done: false
    requirements_target: null

  - id: PR-TPL-09
    title: 应用后图表卡片 chrome 统一为 DataQ 默认
    gate: hi-fi
    criterion: 从市场应用模板进入编辑器后，图/表卡片仍白底浅标题栏；经营驾驶舱/门店零售/KPI 墙允许顶部渐变主视觉或 1 张渐变 KPI。封面以浅灰画布成品稿为主，经营驾驶舱可用深色驾驶舱封面。不做独立数据大屏产品。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html?v=p013t14#/templates
    expected: 市场无精选 Hero；应用经营驾驶舱后可见渐变条+白卡图表；应用转化漏斗后图表仍白卡且布局为漏斗；明细表分页条在卡片内可见。
    evidence: "2026-08-23 t12 手验：费用管控「科目明细」分页条钉在卡片底且首屏可见（pagerInViewport）；应用经营驾驶舱/转化漏斗仍为白卡。"
    status: pass
    blocker_of_done: false
    requirements_target: null

  - id: PR-TPL-10
    title: 模板稿面自带画布筛选
    gate: hi-fi
    criterion: 从市场应用非空白模板后，画布上有日期区间切片 + 至少一个业务维度切片（漏斗为「来源」）。筛选是稿面组件，不只是编辑器顶栏查询条。空白画布不加。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html?v=p013t14#/templates
    expected: 应用转化漏斗后画布可见日期与来源切片；点切片可过滤图表。
    evidence: "2026-08-23 t13 手验：应用转化漏斗后画布有日期切片 + 来源切片（自然/投放/分享）；销售分析补日期并保留区域切片；费用管控为日期+部门；空白画布无切片。"
    status: pass
    blocker_of_done: false
    requirements_target: null

  - id: PR-TPL-11
    title: 再点说明条不撑空画布
    gate: hi-fi
    criterion: 先点图表再点顶部说明条（可点两次），画布组件仍铺满中间栏、右侧不出现大块留白；右栏数据页为文本内容配置，不是空的指标槽。
    method: ui
    command_or_path: .teamai/docs/prototypes/hi-fi/dashboard.html?v=p013t14#/templates
    expected: 选中说明条后面板显示「内容」文本框；board 内组件右缘贴近画布，无大块空白列。
    evidence: "2026-08-23 t13 手验：先点图表（data-ops-open，boardW=559）再点说明条两次，data-ops 关闭、右栏为「内容」而非指标、boardW=799、组件右缘空隙 33px（画布内边距），无大块留白列。"
    status: pass
    blocker_of_done: false
    requirements_target: null
