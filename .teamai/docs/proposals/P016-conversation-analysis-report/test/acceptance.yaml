# P016 acceptance — 对话分析报告
proposal: P016
status: in-progress

items:
  - id: PR-ANR-01
    title: /report 入口与 Lead 一次 spawn
    gate: code
    criterion: slash /report 进入分析报告轨；Lead 只调用一次 od_board_worker（prompt 含 ANALYSIS_REPORT=1），不得调 get_data/insight 细工具。
    method: script
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/commands.js
    expected: /report 用户可见跟帖为人话「写一份分析报告：…」，不含 od_* 协议；Lead 一次 spawn 与 ANALYSIS_REPORT=1 写在 persona / od_board_worker 工具说明，执行时可按 description 补全 prompt。
    status: pass
    evidence: "2026-08-26 commands.test.js 人话跟帖；answer-meta/board-worker 在 description=写分析报告 时补全 ANALYSIS_REPORT=1"
    blocker_of_done: true

  - id: PR-ANR-02
    title: 右侧 HTML / MD 文件预览
    gate: code
    criterion: 分析 worker 开始后右侧分析栏顶层固定为「实时跟随 / 浏览器 / 文件」；实时跟随展示真实工具节点，PlanView 独立展示 PlanningAgent 动态业务任务，禁止用固定工具阶段充当计划；规划必须作为主视图清晰常驻展示，能看到每个任务的序号、状态、说明和最近执行节点，支持点规划回看对应节点，并提供「调整这步」预填输入框；每个 data_analysis 完成后文件页实时新增中间 MD，最终 report_tool 完成后新增 HTML/MD，均可预览、复制、下载；对话 transcript 必须能回放最近一次规划/思考/工具 pill，避免后续回看只剩 Deep diving 或最终文案。
    method: manual
    command_or_path: open-dashboard-frontend/src/conversation/views/ConversationDshSurface.vue
    expected: report-progress 独立返回 steps/plan/files 且 step 带 taskIndex 映射；plan 来自 od_analysis_plan，files 随 od_complete_analysis_task 增长；右侧实时跟随为规划卡片 + 节点详情双栏，点击规划卡定位对应节点，点击「调整这步」预填左侧 composer；iframe React 插件把思考卡片和工具 pill 画进对话 transcript，并在完成/刷新后回放最近一次过程；点 pill 切实时跟随且人工回看不被轮询抢回；report_ready 提升到 Lead 后自动切「文件」，HTML iframe 无 allow-scripts，MD 安全渲染。点收起或新对话后右栏保持关闭，不被同一 run 的 od-report-progress 重开。
    status: wip
    evidence: "2026-09-02 report-progress.test.js 覆盖空数据/数据服务失败/Python预算耗尽 issue+recovery；od_commit_report 成功后 progress.files(final=true) 保留最终 HTML/MD 正文，作为 report_ready 丢正文时的外层兜底。前端 build 通过，右栏支持 needs_action 诊断卡、恢复动作按钮（放宽范围/换业务维度/跳过继续成稿）、mount-time progress 拉取与 localStorage 最近报告快照恢复。真实 ds_sales E2E progress 已跑到 done，产出 5 个中间 MD + final HTML/MD；真实 ds_012eb19e 长链路仍待数据目录接入后手验。"
    blocker_of_done: true

  - id: PR-ANR-03
    title: 产物不是 dashboardId
    gate: code
    criterion: od_commit_report 的 presentation meta 为 odKind=report_ready，无 dashboardId；不调用 apply-patch。
    method: script
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/analysis-worker.test.js
    expected: commit 返回 html/markdown，dashboardId 为空。
    status: pass
    evidence: "2026-08-25 analysis-worker.test + od-eval ANR-REPORT-COMMIT-01"
    blocker_of_done: true

  - id: PR-ANR-04
    title: 细工具 Lead 不可调
    gate: code
    criterion: od_python / od_insight / od_save_insight / od_commit_report 与 get_data 一样 depth≥1；Lead 被 guard 拒绝。
    method: script
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/analysis-worker.test.js
    expected: depth 0 拒绝分析细工具（含 od_python）。
    status: pass
    evidence: "2026-08-26 denies Lead on od_python/od_insight/od_save_insight/od_commit_report"
    blocker_of_done: true

  - id: PR-ANR-05
    title: 分析取数 ≤200 行 / 15s
    gate: code
    criterion: purpose=analysis 时 resultLimit≤200、timeout≤15s；禁止 10k/90s。出板路径仍 ≤20/8s。
    method: script
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/analysis-worker.test.js
    expected: analysis get_data 上限 200/15s；board 不受影响。
    status: pass
    evidence: "2026-08-25 analysis get_data resultLimit=200 timeoutMs=15000"
    blocker_of_done: true

  - id: PR-ANR-06
    title: 图种在有数后由 harness 确定
    gate: code
    criterion: 模型不能传 chartType；有行后才有 suggestedChartType。
    method: script
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/analysis-worker.test.js
    expected: suggestedChartType 来自行数/DATE，chartType 参数无效。
    status: pass
    evidence: "2026-08-25 ignores model chartType=pie/line；ANR-REPORT-COMMIT-01 suggestedChartType=pie"
    blocker_of_done: true

  - id: PR-ANR-07
    title: 取完可换维再取
    gate: code
    criterion: 同一会话可用新 question/dim 再次 od_get_data；空结果提示换维。
    method: script
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/analysis-worker.test.js
    expected: get_data 可复用或新发 handle；空结果 note 含 retry dim。
    status: pass
    evidence: "2026-08-25 PR-ANR-07 unit + od-eval ANR-REPORT-RETRY-01"
    blocker_of_done: true

  - id: PR-ANR-08
    title: 与 P005 边界
    gate: proposal
    criterion: P016 是对话快照 HTML/MD，允许内嵌本次聚合表；P005 是看板解读进 Umo、禁止内嵌结果行、未接受不实现。
    method: manual
    command_or_path: .teamai/docs/proposals/P016-conversation-analysis-report/README.md
    expected: README 写明与 P005 对照表。
    status: pass
    blocker_of_done: true

  - id: PR-ANR-09
    title: AutoAnalysis 方法门控与 Python
    gate: code
    criterion: od_insight 按 JoyAgent 方法门控，不套模板输出 OutstandingLast/Evenness 等不合格条目；明细/主键切片拒绝洞察；分析 worker 可调 od_python（depth≥1），Lead 不可调；最终报告结构由 report Agent 根据子任务文件撰写，harness 不套固定章节。
    method: script
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/analysis-worker.test.js
    expected: Attribution 通过；Evenness 在头部集中时为空；PayOrderId 拒绝；Lead 拒绝 od_python。
    status: pass
    evidence: "2026-08-26 analysis-worker.test.js gated insights + python guard"
    blocker_of_done: true

  - id: PR-ANR-10
    title: JoyAgent 动态规划、子任务文件与 report_tool
    gate: code
    criterion: 报告路径的 Lead 必须只 list dataset 并立即委派 od_board_worker，不能自行 schema/profile、调用 od_plan_charts/od_generate_board 或先回复文字；semanticReady=false 只阻止看板，不得阻止报告；报告 worker 必须先 od_get_schema 再只调一次 od_analysis_plan，计划从用户原问与实际 schema 动态生成且每任务含 businessKnowledge；每个任务由全新 data_analysis CodeAgent 执行并调一次 od_complete_analysis_task，独立 MD 必须保留真实聚合证据表与业务实体；未齐全任务文件不得成稿；第三条洞察不自动成稿，不设订单固定三切片或商户必选闸；最终内容由全新 report Agent 先调 od_read_analysis_files 读取全部子任务文件全文，再只调一次 od_commit_report，harness 只渲染 HTML/MD；最终 Markdown 过薄、丢失商户/经营主体证据、或章节顺序不面向业务用户时必须拒绝提交。最终目录必须以「报告摘要/核心结论」开篇，包含核心发现、分主题分析、结论与建议，任务文件映射/数据边界/证据表只能放在附录。
    method: script+manual
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-bi/src/analysis-worker.test.js
    expected: 单测覆盖动态 Plan 与工具节点分离、逐任务产文件、文件未齐禁止提交、三条洞察不自动成稿、Agent 撰写内容不被渲染器替换、薄报告/丢商户证据/工程口径前置被拒、报告意图不进入看板 semanticReady 门禁；真实浏览器可见动态计划、中间 MD 与最终 HTML/MD，最终报告第一屏先读懂业务结论。
    status: wip
    evidence: "2026-09-02 P016 目标回归 58/58；analysis eval 2/2；函数级集成验证 commit 后 snapshotReportProgress.status=done 且包含 order-report.html/order-report.md 正文。od_list_datasets 已对报告请求中的订单/支付订单语义做业务排序，优先 t_pay_order / ds_012eb19e，避免数据源清单或 ds_sales 抢占；od_commit_report 新增指标数值证据覆盖门禁，只有实体 ID/泛化定性结论、未保留金额/数量等关键数值时拒绝提交。浏览器/HTTP E2E 证明 ds_sales progress 可最终 done 并产出 5 个中间 MD + final HTML/MD；真实 t_pay_order 报告仍待数据目录接入后手验。"
    blocker_of_done: true

  - id: PR-ANR-11
    title: 对话分析不出现绑定工作区
    gate: code
    criterion: 对话分析（含局域网用 IP 打开 Vue）Composer 可直接输入，不得出现「选择一个工作区开始 / 选择工作区 / 绑定工作区」。dsh 文件夹工作区仅内部租户分区，启动即绑定；空 POST /od/bridge 不得清掉默认 demo/workspace-retail。iframe 同域 /dsh/；Vite 拆分 dsh /api 与 Java /api。
    method: script+manual
    command_or_path: opendashboard-dsh-harness/packages/dsh-od-auth/src/bridge-state.test.js
    expected: mergeClientBridge 空身份保留默认租户；本机与局域网打开 /conversations 均可直接提问，无工作区选择器。
    status: wip
    blocker_of_done: true
