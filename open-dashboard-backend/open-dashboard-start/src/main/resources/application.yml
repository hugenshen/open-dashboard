server:
  port: 8080

spring:
  application:
    name: open-dashboard
  datasource:
    url: jdbc:postgresql://localhost:5432/opendashboard
    username: opendashboard
    password: opendashboard
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

opendashboard:
  # When true, query endpoints return stub ResultTable without a live warehouse
  stub-query: true
  bootstrap:
    meta-datasource: false
  datasource:
    crypto-key: opendashboard-local-ds-key
  auth:
    # When true and no X-User-Id header, use demo principal (disable in production)
    dev-fallback: true
    fallback-user-id: demo
    fallback-display-name: 演示用户
    fallback-permissions: "*"
