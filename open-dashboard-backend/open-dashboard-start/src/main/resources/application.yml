server:
  port: 8080

spring:
  application:
    name: open-dashboard
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
  datasource:
    url: jdbc:postgresql://localhost:5432/opendashboard
    username: opendashboard
    password: opendashboard
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

opendashboard:
  # When true, query endpoints return stub ResultTable without a live warehouse
  stub-query: true
  query:
    # Hard stop for live warehouse SQL (JDBC + MySQL max_execution_time / PG statement_timeout)
    timeout-sec: 15
    max-concurrent: 3
    acquire-wait-ms: 2000
    # Aggregate (GROUP BY / COUNT) on tables larger than this: sample then aggregate
    # (avoids full scans on multi-million-row fact tables). 0 disables sampling.
    agg-sample-threshold: 100000
    agg-sample-rows: 50000
  file-import:
    dir: ${user.home}/.opendashboard/file-datasets
  conversation:
    enabled: false
    # Legacy proxy to deleted Python harness (unused after P011 M4). Agent is opendashboard-dsh-harness.
    harness:
      mode: deerflow
      base-url: http://127.0.0.1:3090
      internal-token: od-dev-internal
      timeout-ms: 180000
    llm:
      enabled: false
      base-url: https://api.openai.com/v1
      api-key: ""
      model: gpt-4o-mini
      timeout-ms: 60000
  bootstrap:
    meta-datasource: false
  datasource:
    crypto-key: opendashboard-local-ds-key
  auth:
    # When true and no X-User-Id header, use a demo principal. Keep false by default;
    # local demos should log in explicitly so route guards and 401 behavior are visible.
    dev-fallback: false
    fallback-user-id: demo
    fallback-display-name: 演示用户
    fallback-permissions: "*"
    sso:
      enabled: true
      state-cookie-name: OD_SSO_STATE
      state-ttl-seconds: 600
      default-workspace-id: workspace-retail
      default-role-code: analyst
      providers:
        google:
          enabled: false
          label: Google
          client-id: ${OD_GOOGLE_CLIENT_ID:}
          client-secret: ${OD_GOOGLE_CLIENT_SECRET:}
          redirect-uri: ${OD_GOOGLE_REDIRECT_URI:http://127.0.0.1:8080/api/auth/sso/google/callback}
          scopes: [openid, email, profile]
        oidc:
          enabled: false
          label: Enterprise SSO
          client-id: ${OD_OIDC_CLIENT_ID:}
          client-secret: ${OD_OIDC_CLIENT_SECRET:}
          authorization-uri: ${OD_OIDC_AUTHORIZATION_URI:}
          token-uri: ${OD_OIDC_TOKEN_URI:}
          user-info-uri: ${OD_OIDC_USERINFO_URI:}
          redirect-uri: ${OD_OIDC_REDIRECT_URI:http://127.0.0.1:8080/api/auth/sso/oidc/callback}
          scopes: [openid, email, profile]
